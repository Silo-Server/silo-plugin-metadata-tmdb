name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: Silo-Server/silo-plugin-metadata-tmdb/.github/workflows/trusted-linux-ci.yml@main
    with:
      self_hosted: ${{ github.repository == 'Silo-Server/silo-plugin-metadata-tmdb' && ((github.event_name == 'pull_request' && contains(fromJSON(vars.SILO_CI_MEMBERS || '[]'), github.event.pull_request.user.login)) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
